diploiVersion: v1.0
type: component
name: Odoo
description: Odoo 18 ERP & CRM

hosts:
  - name: Odoo
    identifier: app

images:
  - identifier: app
    prebuildImage: ghcr.io/diploi/component-odoo:[tag]

storage:
  - identifier: data
  - identifier: home
  - identifier: extra-addons

environmentVariables:
  - identifier: INITIAL_ADMIN_PASSWORD
    defaultValue: "${generate-random-password:12}"
    type: secret

dependencies:
  - identifier: postgres
    package: https://github.com/diploi/addon-postgres#v18.3-pgvector
    env:
      include:
        - POSTGRES_HOST:HOST
        - POSTGRES_PORT:PORT
        - POSTGRES_USER:USER
        - POSTGRES_PASSWORD:PASSWORD