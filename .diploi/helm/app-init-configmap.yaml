apiVersion: v1
kind: ConfigMap
metadata:
  name: app-init
  labels:
    app: app
data:
  init.sh: |
    #!/bin/bash
    set -eu

    log() {
      echo "🟩 $(date -u +"%Y-%m-%dT%H:%M:%SZ") $1"
    }

    # Odoo 19+ reads these and they override odoo.conf, so they must name the
    # odoo role. The superuser is only used through superuser_psql.
    export PGUSER="$ODOO_USER" PGPASSWORD="$ODOO_PASSWORD" PGDATABASE="$ODOO_DB"

    superuser_psql() {
      PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" psql -d postgres "$@"
    }

    log "Waiting for PostgreSQL"
    until pg_isready -d postgres >/dev/null 2>&1; do
      sleep 2
    done

    log "Ensuring Odoo role and database exist"
    superuser_psql -v ON_ERROR_STOP=1 \
      -v odoo_user="$ODOO_USER" \
      -v odoo_password="$ODOO_PASSWORD" \
      -v odoo_db="$ODOO_DB" <<'SQL'
    SELECT format(
      'CREATE ROLE %I LOGIN CREATEDB NOSUPERUSER PASSWORD %L',
      :'odoo_user',
      :'odoo_password'
    )
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_roles WHERE rolname = :'odoo_user'
    )
    \gexec

    SELECT format(
      'ALTER ROLE %I WITH LOGIN CREATEDB NOSUPERUSER PASSWORD %L',
      :'odoo_user',
      :'odoo_password'
    )
    \gexec

    SELECT format(
      'CREATE DATABASE %I OWNER %I',
      :'odoo_db',
      :'odoo_user'
    )
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_database WHERE datname = :'odoo_db'
    )
    \gexec

    SELECT format(
      'GRANT ALL PRIVILEGES ON DATABASE %I TO %I',
      :'odoo_db',
      :'odoo_user'
    )
    \gexec
    SQL

    # /etc/odoo is mounted from the data volume (subPath etc-odoo) in the app
    # container, so the config survives pod restarts and image updates.
    if [ ! -f /var/lib/odoo/etc-odoo/odoo.conf ]; then
      log "Creating default odoo.conf in persistent storage"
      mkdir -p /var/lib/odoo/etc-odoo
      cat > /var/lib/odoo/etc-odoo/odoo.conf <<EOF
    [options]
    addons_path = /mnt/extra-addons
    data_dir = /var/lib/odoo
    proxy_mode = True
    admin_passwd = $INITIAL_ADMIN_PASSWORD
    db_host = $PGHOST
    db_port = $PGPORT
    db_user = $ODOO_USER
    db_password = $ODOO_PASSWORD
    db_name = $ODOO_DB
    EOF
    fi

    log "Checking if Odoo database is initialized"
    INITIALIZED=$(psql -tAc "SELECT value FROM diploi_parameters WHERE key = 'initialization'" 2>/dev/null || true)

    if [ "$INITIALIZED" != "done" ]; then
      log "Initializing Odoo database (this can take a few minutes)"
      odoo --config=/var/lib/odoo/etc-odoo/odoo.conf \
        --init=base \
        --stop-after-init

      log "Setting initial admin password"
      python3 <<'PYEOF'
    import os

    import psycopg2
    from passlib.context import CryptContext

    connection = psycopg2.connect(
        dbname=os.environ["ODOO_DB"],
        user=os.environ["ODOO_USER"],
        password=os.environ["ODOO_PASSWORD"],
        host=os.environ["PGHOST"],
        port=os.environ["PGPORT"],
    )
    cursor = connection.cursor()
    password_hash = CryptContext(["pbkdf2_sha512"]).hash(os.environ["INITIAL_ADMIN_PASSWORD"])
    cursor.execute("UPDATE res_users SET password = %s WHERE login = 'admin'", (password_hash,))
    connection.commit()
    connection.close()
    print("Admin password set")
    PYEOF

      psql -v ON_ERROR_STOP=1 \
        -c "CREATE TABLE IF NOT EXISTS diploi_parameters (key TEXT PRIMARY KEY, value TEXT)" \
        -c "INSERT INTO diploi_parameters (key, value) VALUES ('initialization', 'done') ON CONFLICT (key) DO NOTHING"
    fi

    #
    # Module sets (docs/OdooModules.md in the platform repository). The core mounts every set bundle it has at
    # /mnt/addons/<set> and lists them in DIPLOI_MODULE_SETS as "<set>=<checked> ..."; diploi_parameters remembers
    # which sets are installed (module_set:<set> = the bundle's build). Checked and not installed: install the
    # bundle's installModules. Checked with another build: update them. Unchecked and installed: uninstall every
    # module of the set, which Odoo extends to the modules depending on them. The bundle is still mounted for that
    # start, because the core keeps a bundle on the disk while the component declares it.
    #

    CONF=/var/lib/odoo/etc-odoo/odoo.conf
    psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS diploi_parameters (key TEXT PRIMARY KEY, value TEXT)"

    manifest_value() { # <set> <jq-like path: build | modules | installModules>
      python3 - "/mnt/addons/$1/manifest.json" "$2" <<'PYEOF'
    import json, sys
    value = json.load(open(sys.argv[1]))[sys.argv[2]]
    print(",".join(value) if isinstance(value, list) else value)
    PYEOF
    }
    set_parameter() { psql -v ON_ERROR_STOP=1 -c "INSERT INTO diploi_parameters (key, value) VALUES ('$1', '$2') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value"; }
    get_parameter() { psql -tAc "SELECT value FROM diploi_parameters WHERE key = '$1'"; }
    set_addons_path() { sed -i "s#^addons_path = .*#addons_path = $1#" "$CONF"; }

    mounted_path=/mnt/extra-addons
    enabled_path=/mnt/extra-addons
    for entry in ${DIPLOI_MODULE_SETS:-}; do
      set_name=${entry%%=*}
      [ -f "/mnt/addons/$set_name/manifest.json" ] || { log "Module set $set_name: no manifest.json in the bundle, ignored"; continue; }
      mounted_path="$mounted_path,/mnt/addons/$set_name"
      [ "${entry#*=}" = true ] && enabled_path="$enabled_path,/mnt/addons/$set_name"
    done
    # Every mounted set is on the path while installing and uninstalling
    set_addons_path "$mounted_path"

    for entry in ${DIPLOI_MODULE_SETS:-}; do
      set_name=${entry%%=*}
      checked=${entry#*=}
      [ -f "/mnt/addons/$set_name/manifest.json" ] || continue
      build=$(manifest_value "$set_name" build)
      installed=$(get_parameter "module_set:$set_name")

      if [ "$checked" = true ] && [ -z "$installed" ]; then
        modules=$(manifest_value "$set_name" installModules)
        log "Module set $set_name: installing $modules (build $build)"
        odoo --config="$CONF" --init="$modules" --stop-after-init
        set_parameter "module_set:$set_name" "$build"
      elif [ "$checked" = true ] && [ "$installed" != "$build" ]; then
        modules=$(manifest_value "$set_name" installModules)
        log "Module set $set_name: updating $modules ($installed -> $build)"
        odoo --config="$CONF" --update="$modules" --stop-after-init
        set_parameter "module_set:$set_name" "$build"
      elif [ "$checked" != true ] && [ -n "$installed" ]; then
        log "Module set $set_name: uninstalling its modules and the modules depending on them"
        MODULES=$(manifest_value "$set_name" modules) odoo shell --config="$CONF" --no-http <<'PYEOF'
    import os
    names = os.environ["MODULES"].split(",")
    modules = env["ir.module.module"].search([("name", "in", names), ("state", "not in", ["uninstalled", "uninstallable"])])
    print("Uninstalling", ", ".join(modules.mapped("name")))
    modules.button_immediate_uninstall()
    env.cr.commit()
    PYEOF
        psql -v ON_ERROR_STOP=1 -c "DELETE FROM diploi_parameters WHERE key = 'module_set:$set_name'"
      fi
    done

    # A set recorded as installed whose bundle is not mounted: its modules are in the database but their code is
    # gone, so Odoo cannot start. This happens when a set was unchecked and the deployment stopped before Odoo
    # started again (a new core never fetched the bundle). Checking the set again gets the bundle back.
    for key in $(psql -tAc "SELECT key FROM diploi_parameters WHERE key LIKE 'module_set:%'"); do
      set_name=${key#module_set:}
      case " ${DIPLOI_MODULE_SETS:-} " in *" $set_name="*) ;; *)
        log "ERROR: module set $set_name is installed but its bundle is not available. Check '$set_name' again in the"
        log "       deployment options, let Odoo start, and then uncheck it to uninstall the modules"
        exit 1 ;;
      esac
    done

    set_addons_path "$enabled_path"
    log "Module sets: addons_path = $enabled_path"

    log "Odoo init complete"
