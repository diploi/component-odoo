apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    matchLabels:
      app: app
  strategy:
  {{- if eq .Values.stage "development"}}
    type: Recreate
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  {{- end }}
  replicas: {{ ternary 1 0 .Values.enabled }}
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: diploi-pull-secret
      initContainers:
        - name: odoo-init
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          command:
            - /bin/bash
            - /diploi-init/init.sh
          env:
            - name: PGHOST
              value: {{ .Values.envMap.HOST.value | quote }}
            - name: PGPORT
              value: {{ .Values.envMap.PORT.value | quote }}
            - name: PGUSER
              value: {{ .Values.envMap.POSTGRES_USER.value | quote }}
            - name: PGPASSWORD
              value: {{ .Values.envMap.POSTGRES_PASSWORD.value | quote }}
            - name: ODOO_USER
              value: {{ .Values.envMap.USER.value | quote }}
            - name: ODOO_PASSWORD
              value: {{ .Values.envMap.PASSWORD.value | quote }}
            - name: ODOO_DB
              value: {{ .Values.envMap.DATABASE.value | quote }}
            - name: INITIAL_ADMIN_PASSWORD
              value: {{ .Values.envMap.INITIAL_ADMIN_PASSWORD.value | quote }}
          volumeMounts:
            - name: init-script
              mountPath: /diploi-init
              readOnly: true
            - name: data-mount
              mountPath: /var/lib/odoo
            {{- if hasKey .Values.storage "extra-addons" }}
            - name: extra-addons-mount
              mountPath: /mnt/extra-addons
            {{- end }}

      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          #workingDir: /app/{{ .Values.identifier }}
          #command: ['sh', '-c', 'echo The app is running! && sleep 10000']
          ports:
            - containerPort: 8069
          {{- if eq .Values.stage "development" }}
          workingDir: /app{{ .Values.folder }}
          {{- with .Values.containerCommands.developmentStart }}
          command:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- else }}
          {{- with .Values.containerCommands.productionStart }}
          command:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- end }}
          env:
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.parameterGroups }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
            - name: APP_PUBLIC_URL
              value: {{ .Values.hosts.app }}
            - name: STAGE
              value: {{ .Values.stage }}
          volumeMounts:
            - name: data-mount
              mountPath: /var/lib/odoo
            # Persistent Odoo config, initialized by the odoo-init container
            - name: data-mount
              mountPath: /etc/odoo
              subPath: etc-odoo
            {{- if hasKey .Values.storage "home" }}
            - name: home-mount
              mountPath: /home/odoo
            {{- end }}
            {{- if hasKey .Values.storage "extra-addons" }}
            - name: extra-addons-mount
              mountPath: /mnt/extra-addons
            {{- end }}
      volumes:
        - name: init-script
          configMap:
            name: app-init
        - name: data-mount
          hostPath:
            path: {{ .Values.storage.data.hostPath }}
        {{- if hasKey .Values.storage "home" }}
        - name: home-mount
          hostPath:
            path: {{ .Values.storage.home.hostPath }}
        {{- end }}
        {{- if hasKey .Values.storage "extra-addons" }}
        - name: extra-addons-mount
          hostPath:
            path: {{ index (index .Values.storage "extra-addons") "hostPath" }}
        {{- end }}



